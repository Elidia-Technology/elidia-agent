name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Elidia — traces conversations, LLM calls, and tool usage. Opt-in via `elidia plugins enable observability/langfuse` or `elidia tools → Langfuse Observability`."
author: AiUtils
requires_env:
  - ELIDIA_LANGFUSE_PUBLIC_KEY
  - ELIDIA_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
