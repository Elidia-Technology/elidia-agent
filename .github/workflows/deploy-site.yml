name: Deploy Site

on:
  release:
    types: [published]
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'skills/**'
      - 'optional-skills/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-vercel:
    # Optional out-of-band production push. The docs are served via GitHub
    # Pages (deploy-docs below), so Vercel is NOT required for the docs to
    # ship. If a Vercel project is connected (e.g. to serve aiutils.io/docs),
    # set the VERCEL_DEPLOY_HOOK secret; until then this job is a no-op so a
    # missing hook does not fail the workflow.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy (no-op if hook unset)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK:-}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret is not set — skipping Vercel deploy."
            echo "Docs ship via GitHub Pages (deploy-docs). To also deploy to Vercel:"
            echo "Vercel -> Project -> Settings -> Git -> Deploy Hooks -> Create Hook,"
            echo "then set its URL as the VERCEL_DEPLOY_HOOK Actions secret."
            exit 0
          fi
          # --fail makes curl exit non-zero on any 4xx/5xx so a rejected deploy
          # fails the job instead of passing silently; --silent suppresses the
          # progress bar and the hook URL is a secret that is never printed.
          curl --fail --silent --show-error -X POST "${VERCEL_DEPLOY_HOOK}"
          echo
          echo "Vercel deploy hook accepted (HTTP 2xx)."

  deploy-docs:
    if: github.repository == 'Elidia-Technology/elidia-agent'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install PyYAML for skill extraction
        run: pip install pyyaml==6.0.2 httpx==0.28.1

      - name: Build skills index (unified multi-source catalog)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Always rebuild — the file isn't committed (gitignored), so a
          # fresh checkout starts without it and we want the freshest crawl
          # in every deploy. Failure is non-fatal: extract-skills.py will
          # fall back to the legacy snapshot cache and the Skills Hub page
          # still renders, just without the latest community catalog.
          # `timeout` bounds the crawl: individual httpx calls carry their own
          # timeouts, but a hung source can otherwise stall the whole deploy.
          # On timeout/error the non-fatal fallback keeps the docs site building
          # from the legacy snapshot cache.
          timeout 300 python3 scripts/build_skills_index.py || echo "Skills index build failed (non-fatal)"

      - name: Extract skill metadata for dashboard
        run: python3 website/scripts/extract-skills.py

      - name: Regenerate per-skill docs pages + catalogs
        run: python3 website/scripts/generate-skill-docs.py

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build Docusaurus
        run: npm run build
        working-directory: website

      - name: Stage deployment
        run: |
          mkdir -p _site/docs
          cp -r website/build/* _site/docs/
          # llms.txt / llms-full.txt are also published at the site root
          # (https://aiutils.io/llms.txt) because some
          # agents and IDE plugins probe the classic root-level path rather
          # than /docs/llms.txt. Same file, two URLs, one source of truth.
          if [ -f website/build/llms.txt ]; then
            cp website/build/llms.txt _site/llms.txt
          fi
          if [ -f website/build/llms-full.txt ]; then
            cp website/build/llms-full.txt _site/llms-full.txt
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
