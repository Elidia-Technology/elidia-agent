name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate: workflow_dispatch is already restricted to users with write access,
  # but we want ADMIN-only. Explicitly check the triggering actor's repo
  # permission via the API and fail fast for anyone below admin.
  authorize:
    name: Authorize (admins only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check actor is a repo admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm=$(gh api \
            "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
            --jq '.permission')
          echo "Actor '${ACTOR}' has permission: ${perm}"
          if [ "${perm}" != "admin" ]; then
            echo "::error::'${ACTOR}' is not a repo admin (permission=${perm}). Refusing to build/sign."
            exit 1
          fi
          echo "Authorized: '${ACTOR}' is an admin."

  build:
    name: Elidia-Setup.exe
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    # UNSIGNED BUILD. The original flow logged into Azure and signed the exe via
    # azure/artifact-signing-action (Trusted Signing), but those secrets/vars
    # (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID +
    # AZURE_SIGNING_*) are not configured on this repo, so the sign step could
    # not run. We ship the bootstrap installer unsigned — same posture as the
    # mac/linux desktop artifacts — until the owner wires Trusted Signing. When
    # that happens, re-add:
    #   permissions: { id-token: write }   # for azure/login OIDC
    #   - azure/login (client/tenant/subscription-id from secrets)
    #   - azure/artifact-signing-action (endpoint/account/cert-profile from vars)
    # between "Build installer" and the upload steps below.

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Rust targets
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      # Targeting nsis explicitly: bundle.targets in tauri.conf.json now includes
      # "nsis" (added for this build), but passing --bundles nsis makes the intent
      # unambiguous and skips the mac/linux targets that are meaningless on a
      # Windows runner.
      - name: Build installer (unsigned NSIS bundle)
        run: npm run tauri:build -- --bundles nsis
        working-directory: apps/bootstrap-installer

      # Producing a file is not evidence — verify the NSIS bundle and the raw
      # bootstrap exe actually exist before we try to publish them. The bundle
      # lands under target/release/bundle/nsis/; the raw [[bin]] exe
      # (Elidia-Setup.exe, from Cargo.toml) lands under target/release/.
      - name: Verify build artifacts exist
        shell: pwsh
        run: |
          $nsis = Get-ChildItem 'apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue
          if (-not $nsis) {
            Write-Host "::error::no NSIS bundle .exe produced under bundle/nsis/"
            Get-ChildItem 'apps/bootstrap-installer/src-tauri/target/release' -Recurse -Filter *.exe |
              Select-Object -ExpandProperty FullName
            exit 1
          }
          Write-Host "NSIS bundle: $($nsis.FullName) ($([math]::Round($nsis.Length/1MB,1)) MB)"
          $raw = Get-ChildItem 'apps/bootstrap-installer/src-tauri/target/release/Elidia-Setup.exe' -ErrorAction SilentlyContinue
          if ($raw) {
            Write-Host "raw exe:     $($raw.FullName) ($([math]::Round($raw.Length/1MB,1)) MB)"
          } else {
            Write-Warning "raw Elidia-Setup.exe not at target/release root (bundle-only build) — NSIS installer is the shipped artifact"
          }

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Elidia-Setup-installer
          path: apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload raw exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Elidia-Setup-exe
          path: apps/bootstrap-installer/src-tauri/target/release/Elidia-Setup.exe
          if-no-files-found: warn
