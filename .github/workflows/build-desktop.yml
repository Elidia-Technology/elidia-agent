name: Build Elidia Agent Desktop

# Builds the Electron desktop app (apps/desktop) for macOS, Windows, and Linux,
# then uploads the installers to the production download host (aiutils.io).
#
# Source lives on GitLab; this workflow runs on the GitHub mirror
# (Elidia-Technology/elidia-agent-cli-v2) which is the build + release channel.
#
# Required secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   PROD_DEPLOY_KEY : private key of a dedicated deploy keypair whose public key
#                     is in the prod server's authorized_keys (scoped to upload).
#   PROD_HOST       : e.g. 167.86.89.198
#   PROD_USER       : e.g. aiutils
#
# NOTE: signing/notarization (mac hardenedRuntime + afterSign notarize.cjs,
#       Windows code signing) is intentionally NOT wired here yet. This produces
#       unsigned installers; signing is a follow-up once certs are provisioned.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  build-mac:
    name: macOS (dmg + zip)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (unsigned)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELIDIA_SKIP_NOTARIZE: '1'
        run: npm run dist:mac
      # The runner is Apple Silicon, so a bare `--mac` silently produced arm64
      # only — and the download page told Intel users it would work for them.
      # An Intel Mac cannot execute an arm64 binary at all; Rosetta translates
      # x64 onto ARM, never the reverse.
      - name: Verify both macOS architectures were built
        run: |
          set -euo pipefail
          cd apps/desktop/release
          for arch in x64 arm64; do
            if ! ls *-mac-$arch.dmg >/dev/null 2>&1; then
              echo "::error::no $arch dmg — half of macOS users would get a binary they cannot run"
              ls -la
              exit 1
            fi
            echo "found $(ls *-mac-$arch.dmg)"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

  build-win:
    name: Windows (nsis + msi)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (unsigned)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-win
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
          if-no-files-found: error

  build-linux:
    name: Linux (AppImage + deb + rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - name: Install system deps for deb/rpm/AppImage packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot
      - name: Install dependencies
        run: npm ci
      - name: Build (unsigned)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:linux
      # Every Linux bug we have shipped sat between "the artifact exists" and
      # "the artifact runs": a .deb that installed cleanly and then died on a
      # missing libgbm.so.1, and a first-launch bootstrap that 404'd. Producing
      # a file is not evidence. Launch it.
      - name: Smoke-test the AppImage
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libsecret-1-0 libasound2t64 libgbm1 libdrm2 xvfb
          cd apps/desktop/release
          APPIMAGE=$(ls *.AppImage | head -1)
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract >/dev/null
          set +e
          APPDIR="$PWD/squashfs-root" timeout 20 xvfb-run -a \
            ./squashfs-root/AppRun --no-sandbox > launch.log 2>&1
          code=$?
          set -e
          # 124 means it was still running when timeout fired, which is what a
          # GUI app should do. Anything else means it exited on its own.
          if [ "$code" -ne 124 ]; then
            echo "::error::AppImage exited with $code instead of staying up"
            tail -40 launch.log
            exit 1
          fi
          echo "AppImage stayed up for 20s"

      # The .deb shipped for months declaring nine dependencies while the binary
      # linked against eleven. apt install succeeded and the app would not
      # start. ldd against ONLY the declared set is what catches that.
      # The .deb shipped for months declaring nine dependencies while the binary
      # linked against eleven. apt install succeeded and the app would not
      # start. Installing ONLY the declared set and running ldd is what catches
      # that.
      #
      # The check lives in a file rather than inline: an earlier version
      # embedded it as a double-quoted docker bash -c string, and the escaping
      # through YAML -> shell -> docker-bash broke. A file has one level of
      # quoting and can be run locally, unchanged.
      - name: Verify .deb declares every library the binary needs
        run: |
          set -euo pipefail
          cat > /tmp/deb-check.sh <<'CHECK'
          set -eu
          apt-get update -qq >/dev/null 2>&1
          apt-get install -y -qq --no-install-recommends dpkg-dev >/dev/null 2>&1
          DEPS=$(dpkg-deb -f /w/package.deb Depends | tr ',' ' ')
          echo "declared: $DEPS"
          apt-get install -y -qq --no-install-recommends $DEPS >/dev/null 2>&1 || true
          missing=$(ldd /w/squashfs-root/Elidia 2>/dev/null | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "::error::.deb does not declare every library the binary needs:"
            echo "$missing"
            exit 1
          fi
          echo "every linked library is covered by the declared Depends"
          CHECK
          cd apps/desktop/release
          cp "$(ls *.deb | head -1)" package.deb
          test -d squashfs-root || { echo "::error::no squashfs-root — the AppImage step should have extracted it"; exit 1; }
          # 22.04 on purpose: it is what the download page states as the target
          # ("Ubuntu 22.04+ / Debian 12+") and it is the naming the Depends use.
          # 24.04 renamed libasound2 and libatspi2.0-0 to t64 variants, so testing
          # there reports failures that do not exist for the users we target.
          docker run --rm -v "$PWD:/w" -v /tmp/deb-check.sh:/deb-check.sh ubuntu:22.04 sh /deb-check.sh
          rm -f package.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error

  upload-prod:
    name: Upload installers to production
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download mac artifacts
        uses: actions/download-artifact@7a1cd3216ca9260cd8022db641d960b1db4d1be4  # v4
        with:
          name: desktop-mac
          path: artifacts/mac
      - name: Download win artifacts
        uses: actions/download-artifact@7a1cd3216ca9260cd8022db641d960b1db4d1be4  # v4
        with:
          name: desktop-win
          path: artifacts/win
      - name: Download linux artifacts
        uses: actions/download-artifact@7a1cd3216ca9260cd8022db641d960b1db4d1be4  # v4
        with:
          name: desktop-linux
          path: artifacts/linux

      - name: Normalize to stable -latest- filenames
        run: |
          set -euo pipefail
          cd artifacts
          # macOS -> one file PER ARCHITECTURE.
          #
          # This used to be `head -n1`, which was fine while only one dmg
          # existed. Now that both are built it would pick whichever the shell
          # listed first and silently drop the other — publishing, say, arm64 to
          # every Mac user including Intel, which is the bug that started this.
          for arch in x64 arm64; do
            src=$(find mac -name "*-mac-$arch.dmg" ! -name '*.blockmap' | head -n1)
            if [ -z "$src" ]; then
              echo "::error::no $arch dmg to publish — half of macOS users would get nothing"
              exit 1
            fi
            cp "$src" "Elidia-Agent-latest-macOS-$arch.dmg"
          done
          # Keep the unsuffixed name pointing at Apple Silicon for older links
          # and bookmarks. New links on the download page are arch-explicit.
          cp Elidia-Agent-latest-macOS-arm64.dmg Elidia-Agent-latest-macOS.dmg
          # `find … | head -n1 | xargs -I{} cp {} dest` does NOTHING when find
          # matches nothing — xargs with empty input is a no-op, the pipeline
          # still exits 0, and `set -euo pipefail` sees success. A missing
          # installer therefore left the PREVIOUS release in place and the job
          # went green. That is how Elidia-Agent-latest-windows.exe stayed three
          # hours older than every other artifact in the same publish.
          #
          # Copy explicitly and fail loudly instead.
          publish() {
            local dir="$1" pattern="$2" dest="$3"
            local src
            src=$(find "$dir" -name "$pattern" ! -name '*.blockmap' | head -n1)
            if [ -z "$src" ]; then
              echo "::error::no $pattern in $dir — refusing to publish a release missing $dest"
              exit 1
            fi
            cp "$src" "$dest"
            echo "  $dest <- $src"
          }
          publish win   '*.exe'      Elidia-Agent-latest-windows.exe
          publish win   '*.msi'      Elidia-Agent-latest-windows.msi
          publish linux '*.AppImage' Elidia-Agent-latest-linux.AppImage
          publish linux '*.deb'      Elidia-Agent-latest-linux.deb
          publish linux '*.rpm'      Elidia-Agent-latest-linux.rpm
          ls -la Elidia-Agent-latest-*

      - name: Upload to production via SCP
        env:
          PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PROD_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            artifacts/Elidia-Agent-latest-* \
            "${PROD_USER}@${PROD_HOST}:/var/www/aiutils.io/frontend/public/downloads/"

          # public/ is Vite's SOURCE directory — it is copied into dist/ at
          # build time, and nginx serves dist/. Uploading to public/ alone means
          # the files sit on disk unserved until someone runs a frontend build,
          # so this job reported success while users kept getting the previous
          # release. Verified: an upload at 22:30 left the served files dated
          # 19:05.
          #
          # Copy into dist/ as well so the release is live immediately, and keep
          # the public/ copy so the next frontend build does not drop it.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${PROD_USER}@${PROD_HOST}" \
            'set -e
             cd /var/www/aiutils.io/frontend
             mkdir -p dist/downloads
             cp -f public/downloads/Elidia-Agent-latest-* dist/downloads/
             ls -la dist/downloads/ | head -20'

      # Prove the release is actually reachable. A range request is the only
      # honest check here: this site answers ANY unknown /downloads/ path with
      # HTTP 200 and the SPA shell, so a missing file looks like a successful
      # download of an 8KB HTML page named .dmg.
      - name: Verify the published files are real
        run: |
          set -euo pipefail
          fail=0
          for f in Elidia-Agent-latest-macOS-x64.dmg \
                   Elidia-Agent-latest-macOS-arm64.dmg \
                   Elidia-Agent-latest-linux.deb \
                   Elidia-Agent-latest-linux.AppImage \
                   Elidia-Agent-latest-windows.exe \
                   Elidia-Agent-latest-windows.msi; do
            code=000
            # Retry with a cache-busting query. The CDN can still be serving the
            # pre-upload response — for a file that did not exist a moment ago
            # that cached response is the SPA shell with HTTP 200, so a check run
            # immediately after SCP can fail against a file that is genuinely
            # there. Verified: this step failed while all six were already real.
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-100 \
                -H 'Cache-Control: no-cache' \
                "https://aiutils.io/downloads/$f?cb=${GITHUB_RUN_ID}-$attempt" || echo 000)
              [ "$code" = "206" ] && break
              sleep 10
            done
            if [ "$code" = "206" ]; then
              echo "ok   $f"
            else
              echo "::error::$f is not a real download (HTTP $code — SPA fallback)"
              fail=1
            fi
          done
          exit $fail
