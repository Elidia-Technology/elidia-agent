name: Build Elidia Agent Mobile

# Builds the Tauri mobile app (apps/mobile) for Android — a universal APK and
# an AAB — then uploads them to the production download host (aiutils.io) as
# direct side-load downloads (Elidia-Agent-latest-android.apk / .aab).
#
# iOS is deliberately out of scope here: it needs a macOS runner + Xcode +
# Apple code signing, which is a follow-up once those are provisioned.
#
# Source lives on GitLab; this workflow runs on the GitHub mirror
# (Elidia-Technology/elidia-agent) which is the build + release channel.
#
# Required secrets (GitHub -> Settings -> Secrets and variables -> Actions),
# identical to build-desktop.yml:
#   PROD_DEPLOY_KEY : deploy keypair private key (public key on prod authorized_keys)
#   PROD_HOST       : download host hostname/IP
#   PROD_USER       : SSH user

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-mobile.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Android (apk + aab)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9  # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@00854ea68c109d98c75d956347303bf7c45b0277  # v3
        with:
          # `packages` is a single space-separated string (see the action's
          # action.yml); a YAML block scalar embeds literal newlines and makes
          # sdkmanager look for one bogus package. The action auto-accepts SDK
          # licenses by default (accept-android-sdk-licenses: true), so Gradle
          # can install the platform/NDK the Tauri template pins. We install a
          # common baseline here and let Gradle fill in the rest.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # apps/mobile is an npm workspace member; a single root `npm ci` installs
      # the @tauri-apps/cli devDependency that `tauri android *` needs.
      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project (generates src-tauri/gen/android)
        working-directory: apps/mobile
        run: npx tauri android init

      - name: Configure self-signed signing for release APK
        working-directory: apps/mobile/src-tauri/gen/android
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # keystore.properties is read by the release signingConfig added below.
          # One password is used for both store and key (keytool -storepass/-keypass).
          {
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "password=${ANDROID_KEY_PASSWORD}"
            echo "storeFile=${RUNNER_TEMP}/elidia-agent-upload.jks"
          } > keystore.properties
          base64 -d <<< "${ANDROID_KEY_BASE64}" > "${RUNNER_TEMP}/elidia-agent-upload.jks"
          # Patch the generated app/build.gradle.kts so the release build is
          # signed with the self-signed keystore (Play/Apple signing comes later).
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('app/build.gradle.kts')
          s = p.read_text()

          assert "import java.util.Properties" in s, "Properties import missing"
          s = s.replace("import java.util.Properties",
                        "import java.util.Properties\nimport java.io.FileInputStream", 1)

          signing = (
              "    signingConfigs {\n"
              "        create(\"release\") {\n"
              "            val keystorePropertiesFile = rootProject.file(\"keystore.properties\")\n"
              "            val keystoreProperties = Properties()\n"
              "            if (keystorePropertiesFile.exists()) {\n"
              "                keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
              "            }\n"
              "            keyAlias = keystoreProperties[\"keyAlias\"] as String\n"
              "            keyPassword = keystoreProperties[\"password\"] as String\n"
              "            storeFile = file(keystoreProperties[\"storeFile\"] as String)\n"
              "            storePassword = keystoreProperties[\"password\"] as String\n"
              "            storeType = \"PKCS12\"\n"
              "        }\n"
              "    }\n"
          )
          marker = "    buildTypes {"
          assert marker in s, "buildTypes marker missing"
          s = s.replace(marker, signing + marker, 1)

          rel = '        getByName("release") {'
          assert rel in s, "release buildType missing"
          s = s.replace(rel, rel + '\n            signingConfig = signingConfigs.getByName("release")', 1)

          p.write_text(s)
          print("patched app/build.gradle.kts for release signing")
          PY

      - name: Build Android (apk + aab)
        working-directory: apps/mobile
        run: npx tauri android build

      - name: Locate and normalize artifacts
        run: |
          set -euo pipefail
          cd apps/mobile/src-tauri/gen/android/app/build/outputs
          # Tauri "bundle.targets: all" emits a universal APK and an AAB.
          APK=$(find apk -name '*.apk' ! -name '*.unsigned.apk' | head -1)
          AAB=$(find bundle -name '*.aab' | head -1)
          test -n "$APK" || { echo "::error::no APK produced"; find . -type f | head -50; exit 1; }
          test -n "$AAB" || { echo "::error::no AAB produced"; find . -type f | head -50; exit 1; }
          cp "$APK" Elidia-Agent-latest-android.apk
          cp "$AAB" Elidia-Agent-latest-android.aab
          ls -la Elidia-Agent-latest-android.*

      - name: Verify artifacts are real installers
        run: |
          set -euo pipefail
          cd apps/mobile/src-tauri/gen/android/app/build/outputs
          # A real APK/AAB is multi-MB; a stub is far smaller. The failure this
          # catches is an empty or errored build written under a .apk name.
          MIN=5000000
          for f in Elidia-Agent-latest-android.apk Elidia-Agent-latest-android.aab; do
            size=$(wc -c < "$f")
            if [ "$size" -lt "$MIN" ]; then
              echo "::error::$f is only ${size} bytes — not a real installer"
              exit 1
            fi
            printf 'ok   %-42s %s bytes\n' "$f" "$size"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mobile-android
          path: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/Elidia-Agent-latest-android.apk
            apps/mobile/src-tauri/gen/android/app/build/outputs/Elidia-Agent-latest-android.aab
          if-no-files-found: error

  upload-prod:
    name: Upload installers to production
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: mobile-android
          path: artifacts

      - name: Upload to production via SCP
        env:
          PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PROD_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            artifacts/Elidia-Agent-latest-android.apk \
            artifacts/Elidia-Agent-latest-android.aab \
            "${PROD_USER}@${PROD_HOST}:/var/www/aiutils.io/frontend/public/downloads/"
          # public/downloads/ IS what nginx serves (aliased directly). There is
          # no public/downloads copy — heavy dirs are excluded from the build.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${PROD_USER}@${PROD_HOST}" \
            'ls -la /var/www/aiutils.io/frontend/public/downloads/Elidia-Agent-latest-android.*'

      - name: Verify the release landed in the served directory
        env:
          PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PROD_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${PROD_USER}@${PROD_HOST}" 'bash -s' <<'REMOTE'
          set -u
          cd /var/www/aiutils.io/frontend/public/downloads || {
            echo "::error::public/downloads does not exist"
            exit 1
          }
          fail=0
          MIN=5000000
          for f in Elidia-Agent-latest-android.apk Elidia-Agent-latest-android.aab; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is not in the served directory"
              fail=1
              continue
            fi
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -lt "$MIN" ]; then
              echo "::error::$f is only ${size} bytes — not a real installer"
              fail=1
              continue
            fi
            printf 'ok   %-42s %s bytes\n' "$f" "$size"
          done
          exit $fail
          REMOTE
