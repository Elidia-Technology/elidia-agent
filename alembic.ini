# Alembic configuration for the pooled-runtime Postgres session store
# (AIUT-3078 Phase A). The single-process CLI keeps SQLite and does NOT use
# this; only the pooled gateway worker migrates a Postgres database.
#
# The target URL is resolved in store/migrations/env.py from (in order):
#   1. the -x db_url=... command-line override (alembic -x db_url=...),
#   2. the ELIDIA_POSTGRES_DSN environment variable,
#   3. this file's sqlalchemy.url (left empty here on purpose).
#
# Never commit a real DSN here — credentials live in the runtime env only.

[alembic]
script_location = store/migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally empty; see env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
