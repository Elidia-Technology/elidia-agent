[package]
name = "elidia-agent-mobile"
version = "2.1.0"
description = "Elidia Agent for Android and iOS"
authors = ["Elidia Technology Pvt Ltd"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri's mobile targets build the app as a library and generate the platform
# entry point, so this name is what gen/android and gen/apple link against.
name = "elidia_agent_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
